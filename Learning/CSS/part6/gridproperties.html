<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid properties</title>
    <style>
        #container{
            width: 600px;
            height: 300px;
            background-color: rgb(70, 190, 190);
            display: inline-grid;
            grid-template-rows: repeat(4,1fr);
            /* grid-template-columns: repeat(3,1fr); */
            /* same ho muni ra yesko tarika  */
            grid-template-columns: 1fr 1fr 1fr;
            row-gap: 10px;
            column-gap: 10px;
            /* justify-items: center;
            align-items: center; */
            place-items: center;
            }
        .item{
            width: 100px;
            height: 50px;
            background-color: greenyellow;
            border: 2px solid rgb(200, 152, 152);
            text-align: center;
        }
        .one{
            /* justify-self: start;
            align-self: start; */
            place-self: start;
            }
        .two{
            justify-self: start;
            align-self: center;
        }

    </style>
</head>
<body>
    <h1>Grid Playground</h1>
    <h3>justify-items justify-self align-items align-self</h3>
    <div id="container">
        <div class="item one">1</div>
        <div class="item two">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
    <span>This is Span</span>
</body>
</html>
