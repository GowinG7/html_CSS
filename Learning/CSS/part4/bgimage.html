<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Image</title>
    <style>
      #contain {
        color: white;
        width: 300px;
        height: 200px;
        margin: 10px auto;
        background-color: rgb(12, 83, 12);
        background-image: url("images/bgimage.jpg");
        background-size: contain;
      }
      #cover {
        color: white;
        width: 300px;
        height: 200px;
        margin: 10px auto;
        background-color: rgb(12, 83, 12);
        background-image: url("images/bgimage.jpg");
        background-size: cover;
      }
      #auto {
        color: white;
        width: 300px;
        height: 200px;
        margin: 10px auto;
        background-color: rgb(12, 83, 12);
        background-image: url("images/bgimage.jpg");
        background-size: auto;
      }
    </style>
  </head>
  <body>
    <div id="contain">background-size: contain</div>
    <div id="cover">background-size: cover</div>
    <div id="auto">background-size: auto</div>
  </body>
</html>
