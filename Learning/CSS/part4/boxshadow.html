<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow</title>
    <style>
        div{
            height: 100px;
            width: 250px;
            background-color: #008000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px auto;
            box-shadow: 2px 2px 8px rgb(19, 20, 7);
        }
    </style>
</head>
<body>
    <div>box-shadow</div>
</body>
</html>
