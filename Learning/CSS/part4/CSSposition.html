<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Position</title>
    <style>
      div {
        height: 100px;
        width: 100px;
        background-color: green;
        text-align: center;
        border: 3px solid black;
        margin: 20px;
        display: inline-block;
      }
      #static {
        background-color: yellow;
        position: static;
        top: 100px;
        left: 100px;
      }
      #relative {
        background-color: orange;
        position: relative;
        top: 100px;
        left: 100px;
      }
      #absolute {
        background-color: orange;
        position: absolute;
        top: 100px;
        left: 100px;
      }
      #fixed{
        background-color: orange;
        position: fixed;
        top: 100px;
        left: 100px;
      }
    </style>
  </head>
  <body>
    <section>
      <h2>Static Position demo</h2>
      <div></div>
      <div id="static"></div>
    </section>

    <section>
      <h2>Relative Position demo</h2>
      <div></div>
      <div id="relative">relative</div>
    </section>

    <section>
      <h2>Absolute Position demo</h2>
      <div></div>
      <div id="absolute">absolute</div>
    </section>

    <section>
      <h2>fixed Position demo</h2>
      <div></div>
      <div id="fixed">fixed</div>
    </section>
  </body>
</html>
