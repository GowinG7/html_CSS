<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Example</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: skyblue;
            margin: 0 auto; 
            transition: margin-top 2s steps(6, end) 0.2s;

        }
        div:hover{
            margin-top: 400px;
            background-color: lightgreen;
        }

    </style>
</head>
<body>
    <div></div>
</body>
</html>
