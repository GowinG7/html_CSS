<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline-Blocks css property</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: green;
            border: 2px solid black;
            margin: 5px;
            /* to display all three box in one line : display : inline-block used grda css block element anusar apply hunca tara behave inline element anusar grxa */
            display: inline-block;
        }
    </style>
</head>
<body>
    <div></div>
    <div></div>
    <div></div>
</body>
</html>
