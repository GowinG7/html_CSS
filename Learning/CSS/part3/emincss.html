<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em unit in CSS</title>
    
    <style>
        #outer{
            height: 400px;
            width: 400px;
            border: 2px solid black;
            background-color: pink;
            font-size: 20px;
            margin: 1.2em;
            padding: 1.6em;
        }
        #inner{
            height: 100px;
            width: 100px;
            background-color: cornflowerblue;
            font-size: 0.7em;
            margin: 0.5em;
            padding:1.2em;
        }

        div{
            font-size: 2em; /*snow ball effects in nested elements */
        }
    </style>

</head>
<body>
    <div id="outer"> I am outer div
        <div id="inner">I am inner div</div>
    </div>
    <br>
    <hr>
    <br>

    <div>First
        <div>Second
            <div>Third</div>
        </div>
    </div>

</body>
</html>
