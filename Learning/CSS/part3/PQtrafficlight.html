<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To create traffic light - red, orange, green</title>
    <style>
        .outerdiv{
            height: 200px;
            width: 70px;
            border: 2px solid black;
        }
        
        .inner{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 2px solid black;
            margin: 10px;
        }
        #reddiv{
            background-color: red;
        }
        #yellowdiv{
            background-color: yellow;
        }
        #greendiv{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="outerdiv">
        <div class="inner" id="reddiv"></div>
        <div class="inner" id="yellowdiv"></div>
        <div class="inner" id="greendiv"></div>
    </div>
</body>
</html>
