<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>width(of viewport)</title>
    <style>
        h3{
            background-color: yellow;
            border: 2px solid black;
        }

        @media(width:400px){
            h3{
                background-color: red;
                color: white;
            }
            div{
                height: 100px;
                width: 100px;
                background-color: blue;
            }
        }
    </style>
</head>
<body>
    <h3>Media Queries Demo
        using: media features: width
    </h3>
    <div></div>
</body>
</html>
