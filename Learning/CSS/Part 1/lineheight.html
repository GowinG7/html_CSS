<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line height CSS property</title>
  </head>
  <body>
    <h2 style="color: rgb(14, 90, 90)">
    <h2 style="color: rgb(14, 90, 90)">
  Line height is the CSS property that controls the height of the lines
  <p style="background-color: lightpink">abc</p>
  <p style="background-color: lightpink">abc</p>
  <br>like this gap
</h2>

    <div class="lineheight" style="line-height: normal;background-color: rgb(81, 211, 125);">
        This is the line-height:normal;
      <p>abc</p>
      <p>abc</p>
    </div>
        <div class="lineheight" style="line-height: 2.5;background-color: rgb(190, 173, 192);">
        This is the line-height:2.5; It means 2.5 * normal line height
      <p>abc</p>
      <p>abc</p>
    </div>
  </body>
</html>
