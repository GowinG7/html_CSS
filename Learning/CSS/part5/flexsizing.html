<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex-sizing</title>
    <style>
      #container {
        height: 600px;
        width: 60%;
        background-color: azure;
        margin: 10px auto;
        border: 2px solid black;
        display: flex; /*bydefault flex direction row hunxa */
        flex-direction: row;
        justify-content: flex-start;
        /* flex-wrap: wrap; */
        align-content: flex-start;
      }
      #orange{
        flex:2 2 100px;
        /* flex-shrink: 1; */
        /* flex-grow: 1; */
        /* align-self: flex-start; */
        /* flex-basis: 50px; */
        /* flex-direction row xa so main size bnya width ho ra tei effect dekhinxa  */
      }
      #blue{
        flex: 2;
        /* flex-grow: 2; */
        /* max-width: 400px; */
       /* flex-basis: 400px; */
        /* flex-direction row xa so main size bnya width ho ra tei effect dekhinxa */ 
      }
      h1 {
        text-align: center;
      }
      #container div {
        height: 100px;
        width: 30px;
        color: white;
        text-align: center;
        font-size: 1.5em; /*parent element ko font size anusar bydefualt font-size 16px hunxa it means 24px */
      }
    </style>
  </head>
  <body>
    <h1>Flexbox Playground</h1>
    <div id="container">
      <div style="background-color: violet">violet</div>
      <div style="background-color: indigo">indigo</div>
      <div id="blue" style="background-color: blue;">blue</div>
      <div style="background-color: green">green</div>
      <div style="background-color: yellow">yellow</div>
      <div id="orange" style="background-color: orange;">orange</div>
      <div style="background-color: red">red</div>
    </div>
  </body>
</html>
