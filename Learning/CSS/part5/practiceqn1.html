<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question no.1</title>
    <style>
        .container{
            height: 400px;
            width: 400px;
            background-color: azure;
            border: 3px solid rgb(53, 150, 142);
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
           

        }
        .top{

        }
        .box{

            font-size: 50px;
             text-align: center;
        }
        #navbar{
            height: 50px;
            width: 900px;
            background-color: pink;
            border:2px solid lightseagreen;
            display: flex;
            justify-content: flex-start;
            border-radius: 10px;
        }
        .option{
            height: 50px;
            width: 80px;
            font-size: 24px;
            margin-left: 5px;
            line-height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box top">A</div>
        <div  class="box top">B</div>
        <div  class="box top">C</div>
        <div class="box">D</div>
        <div class="box">E</div>
        <div class="box">F</div>
        <div class="box">G</div>
        <div class="box">H</div>
        <div class="box">I</div>
    </div>
    <br>
    <div id="navbar">
        <div class="option">logo</div>
        <div class="option">Home</div>
        <div class="option">About</div>
        <div class="option">contact</div>
    </div>
</body>
</html>
