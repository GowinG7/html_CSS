<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>align-content</title>
    <style>
      #container {
        height: 600px;
        width: 80%;
        background-color: azure;
        margin: 10px auto;
        border: 2px solid black;
        display: flex; /*bydefault flex direction row hunxa */
        flex-direction: row;
        justify-content: flex-start;
        flex-wrap: wrap;
        /* align-items: baseline; */
        /* multiple lines huda cross axis ma space control grna align content as flex wrap is apply */
        align-content: baseline;
      }
      h1 {
        text-align: center;
      }
      #container div {
        height: 100px;
        width: 300px;
        color: white;
        text-align: center;
        font-size: 1.5em; /*parent element ko font size anusar bydefualt font-size 16px hunxa it means 24px */
      }
    </style>
  </head>
  <body>
    <h1>Flexbox Playground</h1>
    <div id="container">
      <div style="background-color: violet">violet</div>
      <div style="background-color: indigo">indigo</div>
      <div style="background-color: blue;height:75px;">blue</div>
      <div style="background-color: green">green</div>
      <div style="background-color: yellow">yellow</div>
      <div style="background-color: orange; height:100px;font-size:2.5em;">orange</div>
      <div style="background-color: red">red</div>
    </div>
  </body>
</html>
