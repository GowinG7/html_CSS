<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components - Badges</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <span class="badge text-bg-secondary">New</span>
    <h3>Notifications <span class="badge text-bg-primary">10+</span></h3>
    <br>
    <button class="btn rounded-pill btn-primary">
        Followers 
        <span class="badge rounded-pill text-bg-secondary">100+</span>
    </button>
    <br><br>
    <button type="button" class="btn btn-primary position-relative">
  Inbox
  <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
    87+
    <span class="visually-hidden">unread messages</span>
  </span>
</button>
    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
