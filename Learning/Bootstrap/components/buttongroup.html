<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component - Button Group</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Bootstrap Demo</h2>

      <div class="btn-group">
        <button class="btn btn-outline-success">one</button>
        <button class="btn btn-outline-danger">two</button>
        <button class="btn btn-outline-warning">three</button>
      </div>
      <br><br>
      <button class="btn btn-success">one</button>
      <button class="btn btn-failed">two</button>
      <button class="btn btn-warning">three</button>
    </div>

    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
