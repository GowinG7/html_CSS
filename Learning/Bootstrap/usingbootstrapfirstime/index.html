<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap CSS</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <button>Click me</button>
    <button class="btn">btn class only</button>
    <button class="btn btn-danger">danger button</button>
    <button class="btn btn-primary">primary button</button>
    <button class="btn btn-success">success btn</button>
    <button class="btn btn-warning">warning btn</button>
    <button class="btn btn-secondary">secondary btn</button>
    <button class="btn btn-info">info btn</button>

    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
