<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap CSS</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container bg-body-tertiary">
      <h2>Form Demo</h2>
      <form>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="row">
          <div class="mb-3 col">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" />
            <span id="passwordHelpInline" class="form-text">
              Must be 8-20 characters long.
            </span>
          </div>

          <div class="mb-3 col">
            <label class="form-label" for="address">Address</label>
            <input
              type="text"
              class="form-control"
              id="address"
              placeholder="Enter your password"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="country">Select Country</label>
          <select class="form-select" id="country">
            <option selected>Choose...</option>
            <option value="1">Nepal</option>
            <option value="2">Norway</option>
            <option value="3">Dubai</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Select Course:</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="course"
                id="BCA"
              />
              <label class="form-check-label" for="BCA"> BCA </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="course"
                id="Mathematics"
              />
              <label class="form-check-label" for="Mathematics">
                Mathematics
              </label>
            </div>
          </div>
        </div>

        <div class="form-check form-switch mb-3">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="switchCheckDefault"
          />
          <label class="form-check-label" for="switchCheckDefault"
            >Default switch checkbox input</label
          >
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" value="" id="terms" />
          <label class="form-check-label" for="terms"> Do you agree </label>
        </div>

        <div class="col-auto">
          <button type="submit" class="btn btn-primary mb-3">Submit</button>
        </div>
      </form>
    </div>

    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
