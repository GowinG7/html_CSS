<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical alignment</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container bg-secondary">
      <div class="row align-items-center" style="height:200px;">
        <div class="col-3 bg-primary">One of three columns</div>
        <div class="col-3 bg-success">One of three columns</div>
        <div class="col-5 bg-warning">One of three columns</div>
      </div>
</div>
      <br />

      <div class="container bg-warning">
      <div class="row align-items-end" style="height: 400px;">
        <div class="col-2 bg-danger">One of three columns</div>
        <div class="col-4 bg-secondary">One of three columns</div>
        <div class="col-2 bg-primary">One of three columns</div>
      </div>
    </div>
    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
