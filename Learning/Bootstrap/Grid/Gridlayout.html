<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap CSS</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h2>Grid System</h2>
      <div class="row">
        <div class="col bg-success">one</div>
        <div class="col bg-danger">two</div>
      </div>
      <br />
      <div class="row">
        <div class="col bg-success">one</div>
        <div class="col bg-danger">two</div>
        <div class="col bg-warning"></div>
      </div>
      <br />
      <div class="row">
        <div class="col-md-2 bg-primary">One</div>
        <div class="col-md-5 bg-secondary">two</div>
        <div class="col-md-4 bg-warning">three</div>
        <div class="col-md-1 bg-success">four</div>
      </div>
      <br />
      <div class="row">
        <h2>
          medium screen size hit bayeC each col 6 units ra xl hit bayeC each col
          3 unit
        </h2>
        <div class="col-md-6 col-xl-3 bg-primary">One</div>
        <div class="col-md-6 col-xl-3 bg-secondary">two</div>
        <div class="col-md-6 col-xl-3 bg-success">three</div>
      </div>
    </div>

    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
