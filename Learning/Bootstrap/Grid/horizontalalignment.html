<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal alignment</title>
    <!-- Bootstrap CSS cdn links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Grid layout horizontal alignment -->
    <div class="container text-center bg-secondary">
      <div class="row justify-content-start">
        <div class="col-4 bg-primary">One of two columns</div>
        <div class="col-4 bg-success">One of two columns</div>
      </div>
      <br />
      <div class="row justify-content-center">
        <div class="col-4 bg-success">One of two columns</div>
        <div class="col-4 bg-danger">One of two columns</div>
      </div>
      <br />
      <div class="row justify-content-end">
        <div class="col-4 bg-warning">One of two columns</div>
        <div class="col-4 bg-primary">One of two columns</div>
      </div>
      <br />
      <div class="row justify-content-around">
        <div class="col-4 bg-danger">One of two columns</div>
        <div class="col-4 bg-primary">One of two columns</div>
      </div>
      <br />
      <div class="row justify-content-between">
        <div class="col-4 bg-success">One of two columns</div>
        <div class="col-4 bg-warning">One of two columns</div>
      </div>
      <br />
      <div class="row justify-content-evenly">
        <div class="col-4 bg-success">One of two columns</div>
        <div class="col-4 bg-primary">One of two columns</div>
      </div>
    </div>
    <!-- Bootstrap JS cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
